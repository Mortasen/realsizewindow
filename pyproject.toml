[project]
name = "realsizewindow"
version = "0.1.0"
description = "A PyQt6 application to display and resize windows using physical measurements."
readme = "README.md"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pyqt6>=6.11.0",
]

[project.scripts]
realsizewindow = "realsizewindow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realsizewindow"]
